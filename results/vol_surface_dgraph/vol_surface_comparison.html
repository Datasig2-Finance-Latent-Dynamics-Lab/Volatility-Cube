<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vol Surface — Model Comparison</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  .slice-row { display:flex; align-items:center; gap:12px; margin-top:14px; }
  .slice-row label { font-weight:500; white-space:nowrap; }
  .slice-row select { width:220px; }
</style>
<script>
let _surfaceNodeId = null;

// ---------- 3-D surface plot ----------
function renderSurfacePlot(nodeId) {
  const sd = D.surface_data && D.surface_data[nodeId];
  if (!sd) return;
  _surfaceNodeId = nodeId;

  const traces = [];

  if (sd.obs.train.length > 0) {
    traces.push({
      type: 'scatter3d', mode: 'markers', name: 'Train obs',
      x: sd.obs.train.map(o => o.k),
      y: sd.obs.train.map(o => o.T),
      z: sd.obs.train.map(o => o.iv),
      marker: {size: 2.5, color: '#888', opacity: 0.75},
    });
  }
  if (sd.obs.test.length > 0) {
    traces.push({
      type: 'scatter3d', mode: 'markers', name: 'Test obs',
      x: sd.obs.test.map(o => o.k),
      y: sd.obs.test.map(o => o.T),
      z: sd.obs.test.map(o => o.iv),
      marker: {size: 4, color: '#111', symbol: 'diamond', opacity: 1},
    });
  }

  const colorscales = [
    [[0,'#BBDEFB'],[1,'#0D47A1']],
    [[0,'#C8E6C9'],[1,'#1B5E20']],
    [[0,'#FFCCBC'],[1,'#BF360C']],
    [[0,'#E1BEE7'],[1,'#4A148C']],
    [[0,'#FFF9C4'],[1,'#F57F17']],
  ];

  D.model_names.forEach((m, i) => {
    const z = sd.models[m];
    if (!z) return;
    traces.push({
      type: 'surface',
      x: sd.k_grid, y: sd.T_grid, z: z,
      colorscale: colorscales[i % colorscales.length],
      opacity: 0.70,
      name: m,
      showscale: false,
      hovertemplate: 'k=%{x:.3f}  T=%{y:.3f}<br>IV=%{z:.2f}%<br>' + m + '<extra></extra>',
    });
  });

  Plotly.react('surface-3d-div', traces, {
    scene: {
      xaxis: {title: {text:'Log-moneyness', font:{size:11}}},
      yaxis: {title: {text:'Maturity (yr)',  font:{size:11}}},
      zaxis: {title: {text:'IV (%)',          font:{size:11}}},
      camera: {eye: {x:-1.6, y:-1.6, z:1.1}},
      aspectmode: 'manual',
      aspectratio: {x:1.2, y:1.0, z:0.7},
    },
    legend: {orientation:'h', y:-0.04, font:{size:11}},
    margin: {t:10, b:10, l:0, r:0},
    height: 520,
  }, {responsive:true});
}

// ---------- T-slice dropdown ----------
function populateTSelect(nodeId) {
  const sd = D.surface_data && D.surface_data[nodeId];
  if (!sd) return;
  const sel = document.getElementById('T-select');
  sel.innerHTML = '';
  sd.T_grid.forEach((T, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = 'T = ' + T.toFixed(3) + ' yr';
    sel.appendChild(o);
  });
  // default to roughly the 6-month maturity
  const midIdx = sd.T_grid.reduce((best, T, i) =>
    Math.abs(T - 0.5) < Math.abs(sd.T_grid[best] - 0.5) ? i : best, 0);
  sel.value = midIdx;
  renderSmileSlice(nodeId, midIdx);
}

// ---------- 2-D smile slice ----------
function renderSmileSlice(nodeId, tIdx) {
  const sd = D.surface_data && D.surface_data[nodeId];
  if (!sd) return;
  const T = sd.T_grid[tIdx];

  const traces = [];

  // Observations within ±30 % of T (by relative distance)
  const bw = T * 0.30;
  const trainNear = sd.obs.train.filter(o => Math.abs(o.T - T) <= bw);
  const testNear  = sd.obs.test.filter(o  => Math.abs(o.T - T) <= bw);

  if (trainNear.length > 0) {
    traces.push({
      x: trainNear.map(o => o.k), y: trainNear.map(o => o.iv),
      mode: 'markers', name: 'Train obs',
      marker: {symbol:'circle-open', size:7, color:'#555',
               line:{color:'#555', width:1.5}},
    });
  }
  if (testNear.length > 0) {
    traces.push({
      x: testNear.map(o => o.k), y: testNear.map(o => o.iv),
      mode: 'markers', name: 'Test obs',
      marker: {symbol:'diamond', size:8, color:'#111'},
    });
  }

  const COLORS = ['#2196F3','#E64A19','#388E3C','#7B1FA2','#F57C00'];
  D.model_names.forEach((m, i) => {
    const z = sd.models[m];
    if (!z) return;
    traces.push({
      x: sd.k_grid, y: z[tIdx],
      mode: 'lines', name: m,
      line: {color: COLORS[i % COLORS.length], width: 2},
    });
  });

  Plotly.react('smile-slice-div', traces, {
    xaxis: {title:'Log-moneyness', zeroline:true,
            zerolinecolor:'#ddd', zerolinewidth:1},
    yaxis: {title:'IV (%)'},
    title: {text:'Smile slice  T ≈ ' + T.toFixed(3) + ' yr', font:{size:13}},
    legend: {orientation:'h', y:-0.28, font:{size:11}},
    margin: {t:40, b:90, l:55, r:20},
    height: 320,
    plot_bgcolor: '#fafafa',
  }, {responsive:true, displayModeBar:false});
}
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         max-width: 1500px; margin: 0 auto; padding: 24px; background: #f4f6f8; color: #333; }
  h1   { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
  h2   { color: #34495e; margin-top: 0; font-size: 1.05em; }
  .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px;
          box-shadow: 0 2px 4px rgba(0,0,0,.08); }
  select { font-size: 14px; padding: 6px 12px; border-radius: 6px;
           border: 1px solid #bdc3c7; background: white; width: 100%;
           max-width: 520px; margin-bottom: 10px; cursor: pointer; }
  select:focus { outline: none; border-color: #3498db; }
</style>
</head>

<div id="surface-3d-div" style="margin-top:16px;"></div>
<div class="slice-row">
  <label>Smile slice:</label>
  <select id="T-select"
          onchange="renderSmileSlice(_surfaceNodeId, +this.value)"></select>
</div>
<div id="smile-slice-div"></div>
</div>

// ---- populate dropdowns ------------------------------------------------
(function() {
  const ns = document.getElementById('node-select');
  D.node_ids.forEach(id => {
    const o = document.createElement('option');
    o.value = id; o.textContent = id; ns.appendChild(o);
  });
})();

// ---- summary table -----------------------------------------------------
(function() {
  const splits = D.has_split
    ? ['train','test','test_unmasked','test_masked']
    : ['train','test'];
  const sLabels = {train:'Train', test:'Test',
                   test_unmasked:'Unmasked', test_masked:'Masked'};
  const hdr = ['Model'];
  splits.forEach(s => D.metrics_keys.forEach(m =>
    hdr.push(sLabels[s] + ' ' + m.toUpperCase())));

  const rows = D.model_names.map(name => {
    const r = D.summary[name];
    const row = [name];
    splits.forEach(s => D.metrics_keys.forEach(m => {
      const v = r[s] ? r[s][m] : null;
      row.push(v != null ? v.toFixed(5) : 'N/A');
    }));
    return row;
  });

  Plotly.newPlot('summary-div', [{
    type: 'table',
    header: { values: hdr, fill: {color:'#2c3e50'}, font: {color:'white', size:12},
              align: 'center', line: {color:'white', width:1} },
    cells: {
      values: hdr.map((_, ci) => rows.map(r => r[ci])),
      fill:   { color: [rows.map((_, i) => i%2===0 ? '#EAF2FF' : 'white')] },
      font:   { size: 12 },
      align:  ['left', ...Array(hdr.length - 1).fill('center')],
      line:   { color: '#dee2e6', width: 0.5 }
    }
  }], { margin:{t:5,b:5,l:5,r:5}, height: 50 + D.model_names.length * 26 },
  { responsive: true, displayModeBar: false });
})();

// ---- helpers -----------------------------------------------------------
function fmtPrec(p) {
  if (p == null) return '—';
  if (typeof p === 'number') return p.toFixed(4);
  if (Array.isArray(p)) {
    const diag = Array.isArray(p[0]) ? p.map((r, i) => r[i]) : p;
    return '[' + diag.slice(0,4).map(x => (+x).toFixed(3)).join(', ')
               + (diag.length > 4 ? '…' : '') + ']';
  }
  return String(p);
}

// ---- node inspector ----------------------------------------------------
function renderNodeParams(nodeId) {
  const nd = D.nodes[nodeId];
  if (!nd) return;
  const rows = D.model_names.map(m => {
    const md = nd.models[m];
    if (!md) return [m, '—', '—'];
    const names = md.param_names && md.param_names.length === md.params.length
      ? md.param_names
      : md.params.map((_, i) => 'c' + i);
    const paramsStr = names.map((n, i) => n + '=' + (+md.params[i]).toFixed(5)).join(',  ');
    return [m, paramsStr, fmtPrec(md.precision)];
  });
  Plotly.newPlot('node-params-div', [{
    type: 'table',
    header: { values: ['Model', 'Parameters', 'Precision'], fill: {color:'#1a6b8a'},
              font: {color:'white', size:12}, align: ['center','left','center'],
              line: {color:'white', width:1} },
    cells: {
      values: [rows.map(r=>r[0]), rows.map(r=>r[1]), rows.map(r=>r[2])],
      fill:   { color: [rows.map((_, i) => i%2===0 ? '#E8F4F8' : 'white')] },
      font:   { size: 12 },
      align:  ['left', 'left', 'center'],
      line:   { color: '#dee2e6', width: 0.5 }
    }
  }], { margin:{t:5,b:5,l:5,r:5}, height: 50 + D.model_names.length * 26 },
  { responsive: true, displayModeBar: false });
}

function onNodeChange(nodeId) {
  renderNodeParams(nodeId);
  renderSurfacePlot(nodeId); populateTSelect(nodeId);
}

// ---- initialise --------------------------------------------------------
if (D.node_ids.length > 0) onNodeChange(D.node_ids[0]);
</script>
